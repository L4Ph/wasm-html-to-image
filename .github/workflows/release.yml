name: Release

# Runs after "Deploy to GitHub Pages" has passed on master (it builds and tests every commit), and publishes what that
# run built: the dist folders of wasm-quickjs-dom and wasm-html-to-image, uploaded as the `release-dist` artifact.
# Nothing is compiled or tested again here. A manual run publishes the latest passing Deploy run of master.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-wasm-html-to-image
  cancel-in-progress: false

jobs:
  check-version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      publish_qjs: ${{ steps.qjs.outputs.publish_qjs }}
      run_id: ${{ steps.deploy.outputs.run_id }}
      sha: ${{ steps.deploy.outputs.sha }}
    steps:
      - name: Find the Deploy run to publish
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            read -r RUN_ID SHA < <(gh run list --repo "${{ github.repository }}" --workflow deploy.yml --branch master --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          if [ -z "$RUN_ID" ] || [ -z "$SHA" ]; then
            echo "No passing Deploy run found on master."
            exit 1
          fi
          echo "Publishing run $RUN_ID at $SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.deploy.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check package version and git tag
        id: check
        run: |
          VERSION=$(node -p "require('./packages/html-to-image/package.json').version")
          TAG="v$VERSION"
          echo "Package version: $VERSION"
          echo "Target tag: $TAG"

          EXISTS=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$EXISTS" ]; then
            echo "Tag $TAG already exists on remote. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist on remote. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      # wasm-quickjs-dom is versioned on its own: a new version there is published even when wasm-html-to-image has none
      - name: Check wasm-quickjs-dom version on npm
        id: qjs
        run: |
          QJS_VERSION=$(node -p "require('./packages/quickjs-dom/package.json').version")
          if [ -z "$(npm view "wasm-quickjs-dom@$QJS_VERSION" version 2>/dev/null)" ]; then
            echo "wasm-quickjs-dom@$QJS_VERSION is not on npm. It will be published."
            echo "publish_qjs=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm-quickjs-dom@$QJS_VERSION is already on npm."
            echo "publish_qjs=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' || needs.check-version.outputs.publish_qjs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-version.outputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # what the Deploy run built from this very commit
      - name: Download the built packages
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist
          run-id: ${{ needs.check-version.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Put the built packages in place
        run: |
          for pkg in html-to-image quickjs-dom; do
            test -d "release-dist/$pkg/dist" || { echo "release-dist/$pkg/dist is missing"; exit 1; }
            rm -rf "packages/$pkg/dist"
            cp -r "release-dist/$pkg/dist" "packages/$pkg/dist"
          done

      - name: Create and push git tag
        if: needs.check-version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check-version.outputs.tag }}"
          git push origin "${{ needs.check-version.outputs.tag }}"

      - name: Create GitHub Release
        if: needs.check-version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check-version.outputs.tag }}" \
            --title "${{ needs.check-version.outputs.tag }}" \
            --generate-notes

      # --ignore-scripts: the packages' prepublishOnly would build them again; they are built already
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          npm install -g npm@latest
          # wasm-html-to-image depends on wasm-quickjs-dom, so that one goes first (only when its version is new)
          if [ "${{ needs.check-version.outputs.publish_qjs }}" = "true" ]; then
            pnpm --filter wasm-quickjs-dom publish --provenance --access public --no-git-checks --ignore-scripts
          fi
          if [ "${{ needs.check-version.outputs.should_release }}" = "true" ]; then
            pnpm --filter wasm-html-to-image publish --provenance --access public --no-git-checks --ignore-scripts
          fi
